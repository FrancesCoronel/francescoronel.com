name: Draft LinkedIn post on new blog post

on:
  push:
    branches: [main]
    paths:
      - "content/blog/**/*.mdx"

jobs:
  draft-linkedin:
    name: Draft LinkedIn post to Slack
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Detect newly added blog posts
        id: new-posts
        run: |
          NEW=$(git diff --name-status HEAD~1 HEAD -- 'content/blog/**/*.mdx' \
            | awk '$1 == "A" { print $2 }')
          echo "files<<EOF" >> "$GITHUB_OUTPUT"
          echo "$NEW" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Draft LinkedIn posts to Slack
        if: steps.new-posts.outputs.files != ''
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: C0B9JB5D00G
        run: |
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            echo "→ Drafting LinkedIn post for $file"
            node scripts/draft-linkedin.js "$file"
          done <<< "${{ steps.new-posts.outputs.files }}"
