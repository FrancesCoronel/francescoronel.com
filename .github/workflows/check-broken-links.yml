name: Check Broken Links

on:
  pull_request:
    paths:
      - "content/**"
      - "app/**"
  push:
    branches: [main]
    paths:
      - "content/**"
      - "app/**"
  schedule:
    - cron: "0 9 * * 1"  # Every Monday at 9am UTC
  workflow_dispatch:

concurrency:
  group: check-broken-links-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Internal link integrity (routes, slugs, featured images) ──────────────
  check-internal:
    name: Internal links
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22

      - name: Check internal links, slugs, and featured image domains
        id: internal
        run: node scripts/check-broken-links.js

      - name: Notify Slack on failure
        if: failure() && steps.internal.outcome == 'failure' && github.event_name == 'schedule'
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d  # v4.0.0
        with:
          channel-id: ${{ secrets.SLACK_CHANNEL_ID }}
          payload: |
            {
              "text": ":broken_heart: *Broken internal links detected on francescoronel.com*",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ":broken_heart: *Broken internal links detected on francescoronel.com*\n\nThe weekly link check found issues with internal routes, slugs, or featured image domains."
                  }
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": { "type": "plain_text", "text": "View Run" },
                      "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}

  # ── External link checker (lychee) ────────────────────────────────────────
  check-external:
    name: External links (lychee)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Check external links
        id: lychee
        continue-on-error: true
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8  # v2.9.0
        with:
          args: >-
            --config lychee.toml
            --no-progress
            --output ./lychee/out.md
            --format markdown
            app/uses/page.tsx
            app/speaking/page.tsx
            app/about/page.tsx
            app/contact/page.tsx
            app/mentoring/page.tsx
            content/projects.json
          # Don't fail the job — let the issue + Slack do the alerting
          fail: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Open or update GitHub issue if broken links found
        if: steps.lychee.outputs.exit_code != 0
        continue-on-error: true
        uses: peter-evans/create-issue-from-file@fca9117c27cdc29c6c4db3b86c48e4115a786710  # v6.0.0
        with:
          title: "🔗 Broken external links detected"
          content-filepath: ./lychee/out.md
          labels: |
            bug
            maintenance

      - name: Notify Slack if broken links found
        if: steps.lychee.outputs.exit_code != 0 && github.event_name == 'schedule'
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d  # v4.0.0
        with:
          channel-id: ${{ secrets.SLACK_CHANNEL_ID }}
          payload: |
            {
              "text": ":link: *Broken external links detected on francescoronel.com*",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ":link: *Broken external links detected on francescoronel.com*\n\nThe weekly link check found dead URLs in page files or project data. A GitHub issue has been opened with the full report."
                  }
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": { "type": "plain_text", "text": "View Issues" },
                      "url": "${{ github.server_url }}/${{ github.repository }}/issues?q=is%3Aissue+is%3Aopen+label%3Amaintenance"
                    },
                    {
                      "type": "button",
                      "text": { "type": "plain_text", "text": "View Run" },
                      "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
