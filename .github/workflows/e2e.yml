name: E2E tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Smoke + component tests (fast, every PR) ──────────────────────────────
  e2e:
    name: Playwright smoke & component tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write   # needed to post screenshot comment

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af  # v4.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build
        run: |
          npx next build
          npx pagefind --site .next/server/app --output-path public/pagefind || true

      - name: Start server
        run: npm run start &
        env:
          PORT: 3000

      - name: Wait for server
        run: npx wait-on http://localhost:3000 --timeout 60000

      - name: Run smoke tests
        run: npm run test:e2e:smoke
        env:
          CI: true
          BASE_URL: http://localhost:3000

      - name: Run component tests
        run: npm run test:e2e:components
        env:
          CI: true
          BASE_URL: http://localhost:3000

      - name: Run visual screenshots (desktop)
        run: npm run test:e2e:visual
        env:
          CI: true
          BASE_URL: http://localhost:3000

      - name: Run visual screenshots (mobile)
        run: npm run test:e2e:visual:mobile
        env:
          CI: true
          BASE_URL: http://localhost:3000

      - name: Upload Playwright report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload screenshots
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: screenshots
          path: test-results/screenshots/
          retention-days: 14

      # Post a summary comment on PRs linking to the screenshot artifacts
      - name: Comment screenshot links on PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea  # v7.0.1
        with:
          script: |
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const artifactUrl = `${runUrl}#artifacts`;

            const body = [
              '## 📸 Visual snapshots',
              '',
              `Screenshots captured for this PR — [view all artifacts](${artifactUrl}).`,
              '',
              '| Page | Desktop | Mobile |',
              '|------|---------|--------|',
              ...['home','about','posts','speaking','contact','portfolio','testimonials','organizations','experience','education'].map(p =>
                `| \`/${p === 'home' ? '' : p}\` | [desktop](${artifactUrl}) | [mobile](${artifactUrl}) |`
              ),
              '',
              `> Full Playwright HTML report: [open report](${runUrl})`,
            ].join('\n');

            // Delete previous bot comment if it exists
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const prev = comments.find(c => c.user?.type === 'Bot' && c.body?.includes('Visual snapshots'));
            if (prev) {
              await github.rest.issues.deleteComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: prev.id,
              });
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
