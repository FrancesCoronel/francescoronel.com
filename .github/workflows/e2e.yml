name: E2E tests

# Called from pr.yml so the Dependabot auto-merge job can wait on it.
# Concurrency is handled by the caller.
on:
  workflow_call:

jobs:
  # ── Smoke + component tests (fast, every PR) ──────────────────────────────
  e2e:
    name: Playwright smoke & component tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build
        run: |
          npx next build
          node scripts/build-search-index.mjs

      - name: Start server
        run: npm run start &
        env:
          PORT: 3000

      - name: Wait for server
        run: npx wait-on http://localhost:3000 --timeout 60000

      - name: Run smoke tests
        run: npm run test:e2e:smoke
        env:
          CI: true
          BASE_URL: http://localhost:3000

      - name: Run search tests
        run: npm run test:e2e:search
        env:
          CI: true
          BASE_URL: http://localhost:3000

      - name: Run analytics tests
        run: npm run test:e2e:analytics
        env:
          CI: true
          BASE_URL: http://localhost:3000

      - name: Run component tests
        run: npm run test:e2e:components
        env:
          CI: true
          BASE_URL: http://localhost:3000

      - name: Run visual screenshots (desktop)
        run: npm run test:e2e:visual
        env:
          CI: true
          BASE_URL: http://localhost:3000

      - name: Run visual screenshots (mobile)
        run: npm run test:e2e:visual:mobile
        env:
          CI: true
          BASE_URL: http://localhost:3000

      - name: Upload Playwright report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload screenshots
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: screenshots
          path: test-results/screenshots/
          retention-days: 14

      # Goes to the run's summary page (linked from the PR's checks), not the PR thread
      - name: Add screenshot links to job summary
        if: always()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "## 📸 Visual snapshots"
            echo ""
            echo "Desktop and mobile screenshots of /, /about, /posts, /speaking, /contact, /portfolio, /testimonials, /organizations, /experience and /education are in the [screenshots artifact]($RUN_URL#artifacts)."
            echo ""
            echo "The full Playwright HTML report is in the [playwright-report artifact]($RUN_URL#artifacts)."
          } >> "$GITHUB_STEP_SUMMARY"
