name: E2E tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright smoke tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build
        run: |
          npx next build
          npx pagefind --site .next/server/app --output-path public/pagefind || true
        id: build
        continue-on-error: true

      - name: Build check
        run: |
          echo "Build outcome: ${{ steps.build.outcome }}"
          ls .next/BUILD_ID 2>/dev/null && echo "Build OK" || echo "Build FAILED - .next missing"
          if [ "${{ steps.build.outcome }}" = "failure" ]; then exit 1; fi

      - name: Run Playwright tests
        run: npm run test:e2e
        env:
          CI: true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
