name: Cross-post to dev.to

on:
  push:
    branches: [main]
    paths:
      - "content/posts/**/*.mdx"

jobs:
  crosspost:
    name: Cross-post new posts
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 2

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Detect newly added blog posts
        id: new-posts
        run: |
          # Only pick up files that were ADDED (A), not modified (M)
          NEW=$(git diff --name-status HEAD~1 HEAD -- 'content/posts/*.mdx' \
            | awk '$1 == "A" { print $2 }' \
            | tr '\n' ' ')
          echo "files=$NEW" >> "$GITHUB_OUTPUT"

      - name: Cross-post to dev.to
        if: steps.new-posts.outputs.files != ''
        env:
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
        run: |
          for file in ${{ steps.new-posts.outputs.files }}; do
            echo "→ Processing $file"
            node scripts/crosspost-devto.js "$file"
          done
