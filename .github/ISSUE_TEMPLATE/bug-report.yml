name: Report a bug
description: A broken link, rendering issue or accessibility problem on francescoronel.com 🐛
title: "Bug: "
labels: ["bug"]
body:
  - type: dropdown
    id: kind
    attributes:
      label: What kind of problem?
      options:
        - Broken link or missing page
        - Layout or rendering issue
        - Accessibility problem
        - Slow page or performance issue
        - Something else
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Page URL
      placeholder: https://francescoronel.com/...
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click or scroll ...
        3. See ...
  - type: input
    id: environment
    attributes:
      label: Browser, OS and any assistive tech
      placeholder: Firefox on macOS with VoiceOver
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or console errors
      description: Drag images in here, or paste console output.
      render: text
