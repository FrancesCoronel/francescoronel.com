name: Suggest an improvement
description: A performance, accessibility or usability improvement to the site 💡
title: "Improvement: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        This is a personal site, so please check [what I accept](https://github.com/FrancesCoronel/francescoronel.com/blob/main/.github/CONTRIBUTING.md) first. New posts and design overhauls are out of scope.
  - type: textarea
    id: idea
    attributes:
      label: What would you improve?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why would it help?
      description: Lighthouse or pa11y numbers are great if you have them.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Anything else you considered?
