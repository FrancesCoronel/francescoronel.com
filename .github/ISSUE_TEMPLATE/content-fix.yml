name: Fix a typo or content error
description: A typo, outdated detail or wrong fact in a post or page ✏️
title: "Content: "
labels: ["content"]
body:
  - type: input
    id: url
    attributes:
      label: Page URL
      placeholder: https://francescoronel.com/posts/...
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: What does it say now?
    validations:
      required: true
  - type: textarea
    id: suggested
    attributes:
      label: What should it say?
      description: Add a source link if it's a factual correction.
    validations:
      required: true
